<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#23211C" />
<meta name="description" content="Skann oppskrifter fra kokebøkene dine og lagre dem lokalt – helt uten nett." />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Oppskrifter" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" href="icon-192.png" />
<link rel="manifest" href="manifest.json" />
<title>Oppskriftsboka</title>
<style>
  :root {
    --paper:#E9E5DC; --field:#FBFAF6; --ink:#23211C; --ink-soft:#6E685C;
    --seal:#B23A2E; --line:#CDC6B8; --good:#3F6B4E;
    --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; }
  body {
    font-family:var(--sans); color:var(--ink); background:var(--paper);
    line-height:1.45; overscroll-behavior:none;
  }
  .screen { display:none; min-height:100vh; min-height:100dvh; }
  .screen.active { display:block; }
  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }

  /* ---------- header ---------- */
  header { padding:calc(24px + env(safe-area-inset-top)) 20px 8px; }
  .eyebrow { font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--ink-soft); }
  h1 { font-family:var(--serif); font-weight:600; font-size:30px; margin:2px 0 0; letter-spacing:.01em; }
  h2 { font-family:var(--serif); font-weight:600; font-size:24px; margin:22px 0 6px; }

  /* ---------- buttons ---------- */
  .stamp {
    appearance:none; border:none; background:transparent; cursor:pointer;
    width:96px; height:96px; border-radius:50%; position:relative; color:var(--seal);
    display:grid; place-items:center;
  }
  .stamp::before, .stamp::after {
    content:""; position:absolute; inset:0; border-radius:50%; border:2px solid currentColor;
  }
  .stamp::after { inset:8px; border-width:1px; opacity:.55; }
  .stamp span { font-size:10px; letter-spacing:.16em; text-transform:uppercase; font-weight:600; }
  .stamp:active { transform:scale(.96); }
  :focus-visible { outline:3px solid var(--seal); outline-offset:3px; }
  .btn { flex:1; font:inherit; font-size:16px; border-radius:10px; padding:14px; border:1px solid var(--ink); background:var(--ink); color:var(--paper); cursor:pointer; }
  .btn.secondary { background:transparent; color:var(--ink); }
  .btn.danger { background:transparent; color:var(--seal); border-color:var(--seal); }
  .linkbtn { appearance:none; background:none; border:0; font:inherit; color:var(--ink-soft); text-decoration:underline; padding:6px 0; cursor:pointer; }

  /* ---------- list / cards ---------- */
  main { padding:8px 20px 130px; }
  .empty { color:var(--ink-soft); font-size:15px; padding:32px 4px; border-top:1px solid var(--line); }
  .card {
    border-top:1px solid var(--line); padding:16px 4px; display:flex; gap:14px; align-items:baseline;
    cursor:pointer; width:100%; text-align:left; background:none; border-left:0; border-right:0; border-bottom:0;
    font:inherit; color:inherit;
  }
  .card .no { font-family:var(--serif); color:var(--seal); font-size:14px; min-width:26px; }
  .card h3 { font-family:var(--serif); font-weight:600; font-size:19px; margin:0; }
  .card .meta { color:var(--ink-soft); font-size:13px; margin-top:2px; }
  .card .fav { margin-left:auto; color:var(--seal); font-size:15px; }

  .toolbar { display:grid; gap:8px; padding:12px 20px 0; }
  .toolbar .row2 { display:flex; gap:8px; flex-wrap:wrap; }
  .toolbar select, .toolbar input { font:inherit; font-size:14px; padding:9px 10px; border:1px solid var(--line);
    border-radius:8px; background:var(--field); color:var(--ink); }
  .toolbar input[type=search] { width:100%; }
  .toolbar select { flex:1; min-width:110px; }
  .chip { appearance:none; font:inherit; font-size:13px; border:1px solid var(--line); background:var(--field);
    color:var(--ink-soft); border-radius:999px; padding:8px 14px; cursor:pointer; }
  .chip[aria-pressed="true"] { border-color:var(--seal); color:var(--seal); }

  .fab { position:fixed; left:0; right:0; bottom:0; display:grid; place-items:center;
         padding:20px 20px calc(20px + env(safe-area-inset-bottom)); background:linear-gradient(transparent,var(--paper) 38%); }

  /* ---------- camera ---------- */
  #scan { background:#111; position:relative; overflow:hidden; }
  #video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .guide { position:absolute; inset:0; pointer-events:none; }
  .guide .mask { position:absolute; inset:0;
    background:
      linear-gradient(#000a,#000a) 0 0/100% 8% no-repeat,
      linear-gradient(#000a,#000a) 0 100%/100% 5% no-repeat,
      linear-gradient(#000a,#000a) 0 0/5% 100% no-repeat,
      linear-gradient(#000a,#000a) 100% 0/5% 100% no-repeat;
  }
  .frame { position:absolute; left:5%; right:5%; top:8%; bottom:5%; }
  .frame .divider { position:absolute; left:50%; top:6%; bottom:6%; width:1px;
    background:repeating-linear-gradient(#fff6 0 6px,transparent 6px 12px); }
  .corner { position:absolute; width:26px; height:26px; border:2px solid #fff; }
  .corner.tl{left:0;top:0;border-right:0;border-bottom:0}
  .corner.tr{right:0;top:0;border-left:0;border-bottom:0}
  .corner.bl{left:0;bottom:0;border-right:0;border-top:0}
  .corner.br{right:0;bottom:0;border-left:0;border-top:0}
  .hint { position:absolute; left:0; right:0; top:8%; transform:translateY(-130%);
    text-align:center; color:#fff; font-size:13px; letter-spacing:.02em; text-shadow:0 1px 3px #000; }
  .cam-bar { position:absolute; left:0; right:0; bottom:0; padding:20px env(safe-area-inset-right) calc(20px + env(safe-area-inset-bottom)) env(safe-area-inset-left);
    display:flex; align-items:center; justify-content:space-between; }
  .cam-bar .stamp { color:#fff; }
  .ghost { appearance:none; background:#0006; color:#fff; border:1px solid #fff5; border-radius:999px;
    padding:10px 16px; font:inherit; font-size:14px; cursor:pointer; }

  /* ---------- progress ---------- */
  #work { display:grid; place-items:center; text-align:center; gap:14px; padding:80px 24px; }
  .bar { width:min(320px,80vw); height:4px; background:var(--line); border-radius:2px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:var(--seal); transition:width .2s; }

  /* ---------- form ---------- */
  form { padding:8px 20px 140px; }
  label { display:block; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft); margin:18px 0 6px; }
  input, textarea, select {
    width:100%; font:inherit; color:var(--ink); background:var(--field);
    border:1px solid var(--line); border-radius:8px; padding:11px 12px;
  }
  input:focus,textarea:focus,select:focus{ outline:2px solid var(--seal); outline-offset:0; border-color:var(--seal); }
  .title-in { font-family:var(--serif); font-size:24px; padding:8px 12px; }
  .row { display:flex; gap:12px; } .row > div { flex:1; }
  .group { border:1px solid var(--line); border-radius:10px; padding:12px; margin-top:10px; background:#fff5; }
  .group .gname { font-family:var(--serif); font-size:16px; border:0; background:transparent; padding:2px 0; border-bottom:1px dashed var(--line); border-radius:0; }
  .item, .step { display:flex; gap:8px; margin-top:8px; }
  .item input, .step textarea { padding:8px 10px; }
  .step textarea { min-height:46px; resize:vertical; }
  .x { flex:0 0 auto; width:34px; border:1px solid var(--line); background:var(--field); border-radius:8px; color:var(--ink-soft); font-size:18px; cursor:pointer; }
  .add { margin-top:10px; background:none; border:1px dashed var(--line); border-radius:8px; padding:9px; width:100%; color:var(--ink-soft); font:inherit; cursor:pointer; }
  .step-no { font-family:var(--serif); color:var(--seal); flex:0 0 auto; width:22px; padding-top:10px; }
  .actions { position:fixed; left:0; right:0; bottom:0; display:flex; gap:12px; padding:16px 20px calc(16px + env(safe-area-inset-bottom));
    background:linear-gradient(transparent,var(--paper) 30%); }
  .pill { display:inline-block; font-size:12px; color:var(--seal); border:1px solid var(--seal); border-radius:999px; padding:2px 10px; }

  /* ---------- detail / read view ---------- */
  #detail main { padding-bottom:150px; }
  .photo { width:100%; border-radius:12px; border:1px solid var(--line); margin-top:14px; }
  .ing-group { margin-top:14px; }
  .ing-group h3 { font-family:var(--serif); font-size:17px; margin:0 0 4px; }
  .ing-list, .step-list { margin:0; padding-left:20px; }
  .ing-list li { margin:4px 0; }
  .step-list li { margin:10px 0; }
  .scaler { display:flex; align-items:center; gap:10px; margin-top:10px; }
  .scaler button { width:40px; height:40px; border-radius:8px; border:1px solid var(--line); background:var(--field); font:inherit; font-size:18px; cursor:pointer; }
  .scaler output { font-family:var(--serif); font-size:17px; min-width:110px; text-align:center; }
  .detail-meta { color:var(--ink-soft); font-size:14px; margin-top:4px; }

  /* ---------- cook mode ---------- */
  #cook { background:var(--field); }
  #cook .wrap { padding:calc(20px + env(safe-area-inset-top)) 24px 140px; max-width:720px; margin:0 auto; }
  #cookStep { font-size:26px; line-height:1.5; margin-top:20px; }
  #cookCount { font-family:var(--serif); color:var(--seal); }
  details.cook-ing { margin-top:26px; border-top:1px solid var(--line); padding-top:12px; }
  details.cook-ing summary { cursor:pointer; font-size:15px; color:var(--ink-soft); }

  /* ---------- snackbar / banner ---------- */
  .snack { position:fixed; left:16px; right:16px; bottom:calc(90px + env(safe-area-inset-bottom));
    background:var(--ink); color:var(--paper); border-radius:10px; padding:12px 14px; display:none;
    align-items:center; gap:12px; font-size:14px; z-index:50; }
  .snack.show { display:flex; }
  .snack button { appearance:none; background:none; border:0; color:#F0C7B8; font:inherit; text-decoration:underline; cursor:pointer; }
  .banner { position:fixed; left:0; right:0; top:0; background:var(--seal); color:#fff; padding:10px 16px;
    display:none; align-items:center; justify-content:space-between; gap:12px; font-size:14px; z-index:60; }
  .banner.show { display:flex; }
  .banner button { appearance:none; background:#fff2; border:1px solid #fff8; color:#fff; border-radius:8px; padding:6px 12px; font:inherit; cursor:pointer; }

  @media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>

<div class="banner" id="updateBanner" role="status">
  <span>Ny versjon er klar.</span>
  <button id="reloadApp">Oppdater</button>
</div>

<!-- ============ LIST ============ -->
<section id="list" class="screen active">
  <header>
    <div class="eyebrow">Skannet fra kokebøkene dine</div>
    <h1>Oppskriftsboka</h1>
  </header>
  <div class="toolbar">
    <label class="sr-only" for="q">Søk i oppskriftene</label>
    <input id="q" type="search" placeholder="Søk i tittel og ingredienser …" />
    <div class="row2">
      <label class="sr-only" for="fCuisine">Kjøkken</label>
      <select id="fCuisine"><option value="">Alle kjøkken</option></select>
      <label class="sr-only" for="fTime">Maks tid</label>
      <select id="fTime">
        <option value="">All tid</option>
        <option value="20">≤ 20 min</option>
        <option value="30">≤ 30 min</option>
        <option value="60">≤ 60 min</option>
      </select>
      <label class="sr-only" for="fSort">Sortering</label>
      <select id="fSort">
        <option value="nyeste">Nyeste først</option>
        <option value="eldste">Eldste først</option>
        <option value="tittel">A–Å</option>
        <option value="tid">Kortest tid</option>
      </select>
      <button class="chip" id="fFav" aria-pressed="false">★ Favoritter</button>
    </div>
  </div>
  <main id="cards"></main>
  <div class="fab">
    <button class="stamp" id="goScan" aria-label="Skann en side"><span>Skann</span></button>
  </div>
</section>

<!-- ============ CAMERA ============ -->
<section id="scan" class="screen">
  <video id="video" playsinline muted></video>
  <div class="guide" aria-hidden="true">
    <div class="mask"></div>
    <div class="frame">
      <div class="divider"></div>
      <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
    </div>
    <div class="hint">Hele siden innenfor rammen · rett ovenfra · god belysning</div>
  </div>
  <div class="cam-bar">
    <button class="ghost" id="camCancel">Avbryt</button>
    <button class="stamp" id="shutter" aria-label="Ta bilde"><span>Ta bilde</span></button>
    <label class="ghost" style="margin:0">Galleri
      <input id="file" type="file" accept="image/*" hidden />
    </label>
  </div>
</section>

<!-- ============ WORKING ============ -->
<section id="work-screen" class="screen">
  <div id="work">
    <div class="eyebrow">Leser av siden</div>
    <div class="bar"><i id="barFill"></i></div>
    <div id="workMsg" role="status" style="color:var(--ink-soft);font-size:14px">Klargjør tekstgjenkjenning …</div>
  </div>
</section>

<!-- ============ EDIT / RESULT ============ -->
<section id="result" class="screen">
  <header>
    <div class="eyebrow">Sjekk og rett · <span class="pill" id="cuisinePill">kjøkken</span></div>
  </header>
  <form id="form" onsubmit="return false">
    <label for="f-title">Rettens navn</label>
    <input id="f-title" class="title-in" />
    <div class="row">
      <div><label for="f-serv">Porsjoner</label><input id="f-serv" /></div>
      <div><label for="f-time">Tid (min)</label><input id="f-time" inputmode="numeric" /></div>
    </div>
    <label for="f-cuisine">Kjøkken</label>
    <input id="f-cuisine" />
    <label for="f-tags">Tagger (kommaseparert)</label>
    <input id="f-tags" />
    <label>Ingredienser</label>
    <div id="groups"></div>
    <button type="button" class="add" id="addGroup">+ Ny gruppe</button>
    <label>Fremgangsmåte</label>
    <div id="steps"></div>
    <button type="button" class="add" id="addStep">+ Nytt steg</button>
    <div id="scanMore" style="margin-top:18px">
      <button type="button" class="add" id="nextPage">+ Skann neste side</button>
    </div>
  </form>
  <div class="actions">
    <button class="btn secondary" id="discard">Forkast</button>
    <button class="btn" id="save">Lagre</button>
  </div>
</section>

<!-- ============ DETAIL / READ ============ -->
<section id="detail" class="screen">
  <header>
    <button class="linkbtn" id="detailBack">‹ Tilbake</button>
    <h1 id="dTitle">—</h1>
    <div class="detail-meta" id="dMeta"></div>
  </header>
  <main>
    <img class="photo" id="dPhoto" alt="Skannet side" hidden />
    <div class="scaler">
      <button id="servMinus" aria-label="Færre porsjoner">−</button>
      <output id="servOut" for="servMinus servPlus">4 porsjoner</output>
      <button id="servPlus" aria-label="Flere porsjoner">+</button>
    </div>
    <h2>Ingredienser</h2>
    <div id="dIngredients"></div>
    <h2>Fremgangsmåte</h2>
    <ol class="step-list" id="dSteps"></ol>
    <div style="display:flex;gap:12px;margin-top:26px;flex-wrap:wrap">
      <button class="btn secondary" id="dFav" style="flex:0 0 auto">☆ Favoritt</button>
      <button class="btn secondary" id="dEdit" style="flex:0 0 auto">Rediger</button>
      <button class="btn danger" id="dDelete" style="flex:0 0 auto">Slett</button>
    </div>
  </main>
  <div class="actions">
    <button class="btn" id="startCook">Kokkemodus</button>
  </div>
</section>

<!-- ============ COOK MODE ============ -->
<section id="cook" class="screen">
  <div class="wrap">
    <button class="linkbtn" id="cookExit">‹ Avslutt kokkemodus</button>
    <div class="eyebrow" style="margin-top:12px"><span id="cookTitle"></span></div>
    <div id="cookCount">Steg 1 av 1</div>
    <p id="cookStep" role="status">—</p>
    <details class="cook-ing">
      <summary>Ingredienser</summary>
      <div id="cookIngredients"></div>
    </details>
  </div>
  <div class="actions">
    <button class="btn secondary" id="cookPrev">Forrige</button>
    <button class="btn" id="cookNext">Neste</button>
  </div>
</section>

<div class="snack" id="snack" role="status">
  <span id="snackMsg"></span>
  <button id="snackAction" hidden>Angre</button>
</div>

<noscript><p style="padding:24px">Oppskriftsboka trenger JavaScript for å lese av sider og lagre oppskrifter.</p></noscript>

<script type="module" src="js/app.mjs"></script>
</body>
</html>
